#
# Starts the adapter with its demonstration data, starts a real cppagent in a container that reads the SHDR output, and checks that the agent
# serves the same DataItems and values (tools/cppagent_check.py). Manual: it pulls an image from Docker Hub.
# =============================================================================
name: cppagent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cppagent:
    name: A real cppagent reads the SHDR output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the dependencies
        run: npm ci --ignore-scripts
      - name: Start the adapter with its demonstration data
        env:
          HYDRA_UMC_MTCONNECT_DEMO: "1"
          HYDRA_UMC_MTCONNECT_SHDR_PORT: "7878"
          HYDRA_UMC_MTCONNECT_SHDR_HOST: "127.0.0.1"
          PORT: "7700"
        run: |
          nohup npx tsx src/server.ts > adapter.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:7700/probe?shdr=1" -o devices.xml && break; sleep 1; done
          head -c 400 devices.xml; echo
      - name: Start a real cppagent that reads the SHDR output
        run: |
          mkdir -p agentcfg
          cp devices.xml agentcfg/devices.xml
          cat > agentcfg/agent.cfg <<'CFG'
          Devices = /mtconnect/config/devices.xml
          Port = 5000
          ServiceName = HydraAgent
          Adapters {
            HydraNode_1 {
              Host = 127.0.0.1
              Port = 7878
            }
          }
          CFG
          chmod -R a+rwX agentcfg  # the agent runs as another user and writes its log next to the configuration
          docker run -d --name cppagent --network host -v "$PWD/agentcfg:/mtconnect/config" mtconnect/agent /usr/bin/mtcagent run /mtconnect/config/agent.cfg
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5000/probe -o /dev/null && break; sleep 1; done
          docker logs cppagent | tail -20
      - name: Compare what the agent serves with what the adapter serves
        run: python tools/cppagent_check.py http://127.0.0.1:7700 http://127.0.0.1:5000 --wait 30
      - name: Logs on failure
        if: failure()
        run: |
          docker logs cppagent | tail -60 || true
          tail -40 adapter.log || true
