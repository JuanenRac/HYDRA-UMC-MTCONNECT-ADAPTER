#
# Runs the real SHDR reader and the real SHDR server against a simulated machine that speaks SHDR (a TCP feed with a seeded cycle of states) and misbehaves on command, and the readers of HYDRA-UMC-SERVER and of the MQTT broker against a server and a broker that fail. No hardware. See docs/SIMULATION.md.
# It runs on every push and pull request, by hand, and once a week.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 1"

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulated scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - name: Run the scenarios
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          npm ci
          npx vitest run tests/simulation-bench.test.ts tests/simulation-bench-sources.test.ts
